name: Robot Framework Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # Nightly full regression run — ENABLED for now.
  # To turn it back off: comment the two lines below and merge this file
  # into `main` (GitHub only reads `schedule` triggers from the workflow
  # file version on the repo's default branch, not from feature branches).
  # schedule:
  #   - cron: '0 3 * * *'  # 03:00 UTC = 00:00 (midnight) in Brasília
  workflow_dispatch:        # allows manual trigger from the Actions tab
    inputs:
      tag:
        description: 'Robot tag to run'
        required: false
        default: regression
        type: choice
        options:
          - smoke
          - regression
      run_compat:
        description: 'Also run the cross-browser compatibility matrix (Firefox/WebKit/Chromium, "compat"-tagged tests only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: robot-tests-${{ github.ref }}
  cancel-in-progress: true

# Needed by peaceiris/actions-gh-pages to push the Allure report
# to the gh-pages branch using the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  robot-tests:
    name: Run Robot Framework Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine which tag to run
        id: tag
        shell: bash
        run: |
          # PRs get the fast "smoke" subset for quick feedback; pushes to
          # main and the nightly schedule run the full "regression" suite.
          # workflow_dispatch lets a human pick either one on demand.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=smoke" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=regression" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js (required by the Browser library driver)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browsers (rfbrowser init)
        run: rfbrowser init
        # Skips downloading binaries when the cache hits; rfbrowser is idempotent
        # and fast once the browsers are already cached.

      - name: Run Robot Framework tests
        run: |
          pabot \
            --processes 3 \
            --listener allure_robotframework:allure-results \
            --variable HEADLESS:True \
            --include ${{ steps.tag.outputs.value }} \
            --skiponfailure skip \
            --outputdir results \
            --xunit xunit.xml \
            tests/
        continue-on-error: false   # PR/merge must fail if any test breaks
        # pabot runs suites in parallel (--processes 4) instead of robot's
        # single process; all other flags below behave the same as with
        # plain `robot`, since pabot is a drop-in wrapper around it.
        # HEADLESS:True overrides the ${HEADLESS} variable used in
        # global_page.resource's "New Browser" keyword (CLI --variable takes
        # precedence over the *** Variables *** default), so the suite runs
        # headless in CI while local runs keep the resource's own default.
        # --include filters by [Tags]: "smoke" is the small, fast,
        # critical-path subset run on every PR; "regression" covers the
        # whole suite (every test carries it) and runs on merges to main
        # and the nightly schedule.
        # --listener allure_robotframework writes the raw Allure data to
        # allure-results/ (at the root of the workspace, outside results/),
        # which is converted into the HTML report in the steps below.

      - name: Publish summary on GitHub Actions
        if: always()
        run: |
          {
            echo "### Robot Framework Suite Result"
            echo "Tag executed: \`${{ steps.tag.outputs.value }}\`"
            if [ -f results/output.xml ]; then
              echo "Full report (including the **Statistics by Tag** breakdown"
              echo "for smoke/regression/critical/high/medium and ui) is"
              echo "available in the **robot-framework-results** artifact."
            fi
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo ""
              echo "Allure report (with history): https://tfernandes-qa.github.io/robotframework/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (log.html, report.html, output.xml)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robot-framework-results
          path: results/
          retention-days: 15

      - name: Upload JUnit/xUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: robot-junit-report
          path: results/xunit.xml
          retention-days: 15

      # ---------- Allure ----------
      #
      # NOTE: previously used simple-elf/allure-report-action, but that
      # action's Docker image (openjdk:8-jre-alpine) was removed from
      # Docker Hub upstream and the action is unmaintained, so the report
      # generation is now done directly with the Allure CLI (installed via
      # npm) instead of that action.

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      # Checks whether gh-pages exists yet (it won't on the very first run,
      # before any deploy to Pages has happened), to skip the checkout below
      # cleanly instead of letting it fail with retries.
      - name: Check if gh-pages branch exists
        if: always()
        id: gh-pages-check
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Retrieves the history of previous runs from the gh-pages branch.
      - name: Get Allure history
        if: always() && steps.gh-pages-check.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      # Copies the previous run's history/ folder into allure-results so
      # the Allure CLI picks it up and renders the trend graphs.
      - name: Restore Allure history
        if: always()
        run: |
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history allure-results/history
          else
            echo "No previous history found (gh-pages branch or history/ folder doesn't exist yet) — skipping."
          fi

      - name: Generate Allure report with history
        if: always()
        run: allure generate allure-results --clean -o allure-report

      # Publishes to GitHub Pages only on pushes to main (and manual runs on
      # main), so that PRs with the "smoke" subset don't pollute the official
      # trend/flaky-test history, which is fed only by the full suite.
      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      # On PRs, the Allure report is made available as a run artifact.
      - name: Upload Allure report artifact (PRs)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report/
          retention-days: 15

      # ---------- Email with Allure report ----------

      # Single-file version of the report: a self-contained index.html
      # that's ideal as an email attachment.
      - name: Generate single-file Allure report (email attachment)
        if: always()
        run: allure generate allure-results --single-file --clean -o allure-single

      - name: Send Allure report by email
        if: always()
        uses: dawidd6/action-send-mail@v14
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Robot CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: >-
            [${{ job.status == 'success' && 'PASS' || 'FAIL' }}]
            Robot ${{ steps.tag.outputs.value }} —
            ${{ github.repository }} run #${{ github.run_number }}
          html_body: |
            <h3>Robot Framework — run result</h3>
            <p>
              <b>Status:</b> ${{ job.status }}<br>
              <b>Suite:</b> ${{ steps.tag.outputs.value }}<br>
              <b>Event:</b> ${{ github.event_name }}<br>
              <b>Branch/ref:</b> ${{ github.ref_name }}<br>
              <b>Commit:</b> ${{ github.sha }}
            </p>
            <p>
              Full Allure report attached (index.html — opens directly in the browser).<br>
              Run details:
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                run #${{ github.run_number }}
              </a><br>
              Published history (main):
              <a href="https://tfernandes-qa.github.io/robotframework/">tfernandes-qa.github.io/robotframework</a>
            </p>
          attachments: allure-single/index.html

  compat-tests:
    name: Cross-Browser Compatibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Opt-in only: triggered by a manual workflow_dispatch run with
    # "run_compat" checked. Not run on every PR/push — the 12 tests tagged
    # `compat` already run on Chromium as part of the main `robot-tests`
    # job (which the "regression"/"smoke" tag always includes them in);
    # this job's job is specifically to also exercise them on Firefox and
    # WebKit, which is extra cost worth paying deliberately, not on every
    # commit. See the "Cross-Browser Compatibility" section of the README
    # for why this subset and not the full suite.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_compat == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js (required by the Browser library driver)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install browsers (rfbrowser init)
        run: rfbrowser init

      - name: Run compat-tagged tests on ${{ matrix.browser }}
        run: |
          robot \
            --include compat \
            --variable HEADLESS:True \
            --variable BROWSER:${{ matrix.browser }} \
            --skiponfailure skip \
            --outputdir results-${{ matrix.browser }} \
            --xunit xunit-${{ matrix.browser }}.xml \
            tests/
        continue-on-error: false

      - name: Upload results (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compat-results-${{ matrix.browser }}
          path: results-${{ matrix.browser }}/
          retention-days: 15